# Every example is run against a real broker on every push.
#
# This is the whole reason the repository can be trusted. Examples rot: the
# library moves on, the example does not, and a newcomer's first experience is
# a stack trace. Running them here turns that into a red build instead.
#
# An example that merely loads would prove almost nothing, so each one ends by
# checking what it claimed — the attempt counter reached three, the duplicate
# was charged once, the delayed message actually waited, the blocked connection
# still reported itself up — and exits non-zero when it did not. A run of this
# workflow is twenty-one small integration tests that happen to be readable.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  # The library can change without this repository changing at all, and no lock
  # file pins the resolution, so these examples are also run on a schedule. A
  # Monday failure here is how we find out that a released version broke
  # something the documentation still claims.
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  examples:
    name: run the examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          # The floor the library promises. An example that needs a newer Ruby
          # is an example somebody cannot run, and this is the version that
          # catches it: the conditional pins in the Gemfile exist because
          # opentelemetry-api and google-protobuf have both raised their floors
          # past 3.1 since.
          ruby-version: '3.1'
          # No lock file is committed — see the Gemfile — so there is nothing
          # to cache a resolution against. `bundler-cache` would try.
          bundler-cache: false

      - name: Install
        run: bundle install --jobs 4

      - name: Lint
        # Zero offences. The examples are what people copy, so the style they
        # are written in is the style they spread.
        run: bundle exec rubocop

      - name: Start the brokers
        # The same script a contributor runs, so a clean local run and a clean
        # CI run cannot disagree about how the TLS broker is configured. It
        # writes the development certificates with the library's own generator
        # and brings all three brokers up with compose — including the one
        # advanced/04 is allowed to wreck, which is why it is a third broker and
        # not a turn on the shared one.
        run: ./etc/tls-broker.sh

      - name: Run every example
        env:
          # No trailing slash. bunny reads `amqp://host:port/` as a request for
          # the vhost named by the empty string and answers
          # "NOT_ALLOWED - vhost  not found", which is a confusing way to spend
          # twenty minutes.
          ACEMQ_URL: amqp://guest:guest@localhost:5672
          ACEMQ_TLS_URL: amqps://guest:guest@localhost:5671
          ACEMQ_TLS_CA: certs/ca.crt
          # advanced/04 blocks this one with a real memory alarm, and reaches it
          # with `rabbitmqctl` inside the container — so the container name is
          # named here as well as the URL, rather than left to a default that
          # compose could rename underneath the example.
          ACEMQ_BLOCKED_URL: amqp://guest:guest@localhost:5673
          ACEMQ_BLOCKED_CONTAINER: acemq-ruby-examples-blocked-broker
        run: |
          set -o pipefail
          failed=""
          # Every directory holding a main.rb, found rather than listed, so an
          # example added without touching this file is still run.
          for dir in $(find basic intermediate advanced -name main.rb -exec dirname {} \; | sort); do
            echo "::group::$dir"
            if ! bundle exec ruby "$dir/main.rb"; then
              failed="$failed $dir"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::these examples failed:$failed"
            exit 1
          fi

      - name: Check every example actually ran
        # A find that matched nothing would make the step above pass having run
        # nothing at all, which is the quiet way a suite stops testing.
        run: |
          count=$(find basic intermediate advanced -name main.rb | wc -l | tr -d ' ')
          echo "$count examples"
          if [ "$count" -lt 21 ]; then
            echo "::error::found only $count examples; expected at least 21"
            exit 1
          fi

      - name: Check every example has a README
        # An example nobody can read is an example nobody runs.
        run: |
          missing=""
          for dir in $(find basic intermediate advanced -name main.rb -exec dirname {} \;); do
            [ -f "$dir/README.md" ] || missing="$missing $dir"
          done
          if [ -n "$missing" ]; then
            echo "::error::these examples have no README:$missing"
            exit 1
          fi

      - name: What the brokers said, if anything went wrong
        if: failure()
        run: docker compose --profile tls logs --tail 200

  published-gem:
    name: the published gem still installs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'

      # This job used to exist to watch for the day a release carried enough
      # for the Gemfile to stop resolving `main`. 0.5.0 was that day, and the
      # Gemfile resolves the feed now — so the job that watched for it could
      # have gone with the arrangement it watched.
      #
      # It earns its place for a different reason instead. `bundle install` and
      # `gem install` do not read a static feed the same way: Bundler asks for
      # the compact index, RubyGems for the marshalled one, and a feed can
      # serve either correctly while the other is stale or absent. The examples
      # job proves the first. This proves the second — which is the command the
      # library's README actually gives a reader, and the one nothing else
      # here would run.
      - name: Install the released gem from https://acemq.org/gems
        run: |
          gem install acemq-amqp --source https://acemq.org/gems --no-document
          ruby -e 'require "acemq/amqp"; puts "installed #{AceMQ::AMQP::VERSION} from the feed"'

      # And that the package is whole. Every one of these is loaded lazily by
      # something an example does, so a file dropped from the gemspec would
      # otherwise surface as a NameError halfway down an example rather than as
      # the packaging mistake it is.
      - name: Check the published gem carries every optional file
        run: |
          missing=""
          for file in patterns/saga patterns/scheduler patterns/pipeline \
                      codec/yaml codec/toml codec/xml \
                      codec/protobuf codec/avro crypto dev_certificates \
                      telemetry/open_telemetry; do
            ruby -e "require 'acemq/amqp'; require 'acemq/amqp/$file'" 2>/dev/null ||
              missing="$missing $file"
          done
          if [ -n "$missing" ]; then
            echo "::error::the published gem does not carry:$missing"
            exit 1
          fi
          echo "every optional file is in the published gem"

  tracks-the-release:
    name: the floor is the newest release
    runs-on: ubuntu-latest
    # A job of its own rather than another step above, deliberately. A stale
    # floor and a broken example are different findings and both are worth
    # having: the examples still run and still report whatever this job
    # concludes, so a red X here reads as "the recorded version is old", never
    # as "we have no idea whether any of this works".
    #
    # It inherits the workflow's triggers, so it runs on the Monday cron as well
    # as on push. That is the run it exists for: a release moves underneath this
    # repository without a commit landing here, and only something on a timer
    # will ever notice.
    steps:
      - uses: actions/checkout@v4

      - name: The Gemfile floor is the newest released version
        # Hard failure rather than a warning, and the argument is worth writing
        # down because the other choice is tempting.
        #
        # This repository exists to prove the current release works. Recording an
        # older one it makes a claim about a version nothing has run these
        # examples against, and it makes it in a green build -- which is worse
        # than no check at all, because a green build is read as an answer. Three
        # of these examples repositories were once found sitting releases behind,
        # all of them green the whole time.
        #
        # The cost of failing hard is real. A library release legitimately lands
        # before the examples are updated, and during that window this job goes
        # red on a repository nobody has broken. But that window is precisely the
        # thing being measured, the fix is a one-line bump, and a warning buried
        # in a log is what let the drift go unnoticed for releases at a time in
        # the first place.
        #
        # This repository is the one where the check has real teeth rather than
        # merely bookkeeping value. `~>` is pessimistic on the major, so `~> 0.5`
        # and `~> 0.7` have the same ceiling and both resolve the newest 0.x the
        # feed carries -- and no lock file is committed. The examples job would
        # therefore go on passing against a newer library than the Gemfile
        # claims, and nothing would say so. The floor is the only written record
        # of which release these examples were actually run against, and this is
        # what keeps that record true.
        #
        # Compared at major.minor, because major.minor is all a `~>` floor can
        # express. A patch release cannot be tracked in this file, and asking it
        # to would fail forever on a difference the Gemfile has no way to record.
        run: |
          pinned=$(grep -E 'gem "acemq-amqp", "~> ' Gemfile | head -1 | sed 's/.*~> //; s/".*//')
          newest=$(git ls-remote --tags https://github.com/AceMQ-Company/acemq-ruby-amqp \
                     | grep -v '\^{}' | sed 's#.*refs/tags/##' \
                     | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' \
                     | sort -V | tail -1)
          newest_line=$(echo "$newest" | cut -d. -f1,2)

          # An empty answer means the listing failed or the tag naming changed,
          # and comparing against nothing would pass silently forever.
          if [ -z "$newest" ]; then
            echo "::error::no release tags found on acemq-ruby-amqp, so the floor could not be checked"
            exit 1
          fi
          # Also empty if the requirement stops being a `~>` constraint, which is
          # the record this check reads disappearing.
          if [ -z "$pinned" ]; then
            echo "::error::Gemfile has no 'gem \"acemq-amqp\", \"~> <version>\"' line, so the floor could not be checked"
            exit 1
          fi

          if [ "$pinned" != "$newest_line" ]; then
            echo "::error::the Gemfile floors acemq-amqp at ~> $pinned but the newest release is $newest. Edit the acemq-amqp line in Gemfile to \"~> $newest_line\", then run the examples against it."
            exit 1
          fi
          echo "floored at ~> $pinned, and the newest release is $newest"
