# Brokers for the examples. Plain AMQP on 5672, TLS on 5671 for the one example
# that needs it, and a third on 5673 for the one that breaks a broker on purpose.
#
# The TLS listener is not configured here because it cannot be: it needs
# certificates, and the certificates are written by the library. Run
# `./etc/tls-broker.sh`, which writes them into `certs/` and then brings this
# file up with the `tls` profile — the broker reads what was written, and the
# other services stay exactly as they are for everybody who never touches TLS.
#
# `blocked-broker` is for advanced/04-blocked-broker, which raises a real memory
# alarm. An alarm is broker-wide — it stops every connection that publishes, not
# only the one that asked for it — so that example gets a broker of its own
# rather than a turn on the shared one. Nothing has to be generated first, so
# unlike the TLS broker it is not in a profile and comes up with the rest.
services:
  broker:
    image: rabbitmq:4-alpine
    environment:
      # RabbitMQ writes its Erlang cookie under HOME, and the default in this
      # image is not writable on every Docker setup. Pointing it at /tmp is the
      # difference between a broker that starts and one that dies with an
      # "eacces" nobody can interpret.
      HOME: /tmp
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      # A TCP connect is not enough: Docker publishes the port before RabbitMQ
      # is listening, so a connection then succeeds and is immediately reset.
      # This asks the broker itself.
      #
      # HOME is named again here, and not with the value above. The diagnostic
      # reaches the server over Erlang distribution and authenticates with the
      # cookie under HOME — but it runs as root while the server runs as
      # `rabbitmq`, so it has to be pointed at the server's home rather than at
      # root's. Left alone it reads a different cookie, every ping is answered
      # "Invalid challenge reply", and the container never becomes healthy
      # while serving traffic perfectly well.
      test: ["CMD-SHELL", "HOME=/var/lib/rabbitmq rabbitmq-diagnostics -q ping"]
      interval: 5s
      timeout: 10s
      retries: 24

  blocked-broker:
    image: rabbitmq:4-alpine
    # Named rather than left to compose, which would call it after whatever the
    # checkout directory happens to be. advanced/04 raises the alarm by running
    # `rabbitmqctl` inside this container, so the name is something the example
    # has to be able to write down — and `ACEMQ_BLOCKED_CONTAINER` is how a
    # different one is named without editing the example.
    container_name: acemq-ruby-examples-blocked-broker
    environment:
      HOME: /tmp
    ports:
      # 5673, because 5672 is the shared broker's and the point of this one is
      # that it is not the shared broker.
      - "5673:5672"
    healthcheck:
      test: ["CMD-SHELL", "HOME=/var/lib/rabbitmq rabbitmq-diagnostics -q ping"]
      interval: 5s
      timeout: 10s
      retries: 24

  broker-tls:
    profiles: ["tls"]
    image: rabbitmq:4-alpine
    environment:
      HOME: /tmp
    ports:
      # 5671 only. Its rabbitmq.conf keeps a plaintext listener as well, but
      # publishing that too would collide with the broker above, and the two
      # are separate brokers with separate state rather than one with two
      # doors.
      - "5671:5671"
    volumes:
      # `/certs` is the path the generated rabbitmq.conf names, because that is
      # what DevelopmentCertificates writes by default and what the Go and .NET
      # generators write too. Read-only: the broker has no reason to change a
      # private key, and a container that cannot is one fewer way to be
      # surprised.
      - ./certs:/certs:ro
      - ./certs/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "HOME=/var/lib/rabbitmq rabbitmq-diagnostics -q ping"]
      interval: 5s
      timeout: 10s
      retries: 24
